<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--o:#ff6a1a;--y:#ffb020;--t:#ffe6d3;--m:#ff9a4d}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:radial-gradient(ellipse at 50% -5%,#7a2208 0,#1a0805 45%,#0d0403 100%) fixed;color:var(--t);padding:14px 14px 96px;min-height:100vh}
.card{background:#2a0e08cc;border:1px solid #7a3414;border-radius:14px;padding:14px;margin-bottom:10px}
h1{color:var(--y);font-size:20px;margin-bottom:12px}
h2{color:var(--y);font-size:17px;margin-bottom:8px}
p{font-size:13px;line-height:1.5;color:#ffd9bd;margin-top:4px}
.btn{display:block;width:100%;background:linear-gradient(90deg,#ff4d0a,#ffb020);color:#2a0e03;border:0;border-radius:10px;padding:11px;font-weight:700;font-size:14px;text-align:center;margin-top:8px;cursor:pointer}
.btn.g{background:#3a180d;color:var(--y);border:1px solid #7a3414}
.sm{width:auto;margin:0;padding:8px 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tile{background:#2a0e08;border:1px solid #7a3414;border-radius:12px;padding:14px 6px;text-align:center;font-size:13px;cursor:pointer}
.tile b{display:block;font-size:26px;margin-bottom:4px}
.big{font-size:30px;font-weight:800;color:var(--y)}
input,select,textarea{width:100%;background:#1a0805;color:var(--t);border:1px solid #7a3414;border-radius:8px;padding:10px;margin-top:6px;font-size:14px}
label{font-size:12px;color:var(--m);display:block;margin-top:10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1a0805;border-top:1px solid #7a3414;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav div{flex:1;text-align:center;padding:8px 0;font-size:12px;color:var(--m);cursor:pointer}
nav .on{color:var(--y);font-weight:700}
#toast{display:none;position:fixed;top:14px;left:14px;right:14px;background:var(--o);color:#2a0e03;padding:12px;border-radius:10px;font-weight:600;z-index:9;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;color:var(--m)}
</style></head><body>
<div id="toast"></div><div id="app"></div><nav id="nav"></nav>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T={tg_sub:['Telegram kanalga obuna','✈️'],tg_react:['Telegram reaksiya','👍'],tg_star:['Telegram ⭐ reaksiya','⭐'],yt_sub:['YouTube obuna','▶️'],yt_like:['YouTube layk','👍'],yt_comment:['YouTube komment','💬'],ig_sub:['Instagram obuna','📷'],ig_like:['Instagram layk','❤️'],ig_comment:['Instagram komment','💬']};
const LB={start_bonus:'Start bonus (₽)',daily_bonus:'Kunlik bonus (₽)',ref_bonus:'Referal bonus (₽)',rate:'Kurs: 100 000 so\'m = necha ₽',min_dep:'Minimum depozit (so\'m)',card:'Karta raqami',share:'Bajaruvchiga ulush (0.6 = 60%)',price:'Narxlar (JSON)',channels:'Majburiy obuna kanallari (JSON: ["@kanal"])',banned:'Taqiqlangan so\'zlar (JSON)',contest:'Konkurs matni'};
let ME=null,VIEW='home',ADM={};
const go=u=>u.includes('t.me/')?tg.openTelegramLink(u):tg.openLink(u);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>t.style.display='none',3000)}
async function api(p,o={}){
 o.headers={...(o.headers||{}),'X-Init':tg.initData};
 if(o.json){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.json);o.method='POST'}
 let r,d={};try{r=await fetch('/api'+p,o);d=await r.json()}catch(e){toast('Aloqa xatosi');return null}
 if(!r.ok){const m=d.detail||'Xatolik';if(m==='terms'||m==='sub'){ME=await api('/me');render();return null}toast(typeof m==='string'?m:'Xatolik');return null}
 return d}
async function load(){ME=await api('/me');render()}
function nav(v){VIEW=v;render()}
function termsHTML(){return `<div class=card><h1>🔥 Foydalanish shartnomasi</h1>
<p>1. Botdan foydalanayotgan har bir shaxs o'z qilmishiga o'zi javob beradi.</p>
<p>2. Foydalanuvchi 18 yoshdan oshgan bo'lishi kerak.</p>
<p>3. Bot istalgan vaqt o'chirilishi mumkin, depozit qilingan pullar yo'qolishi mumkin.</p>
<p>4. Botda 18+ va axloqqa zid kanal yoki videolar qo'yish taqiqlanadi. Bunday kontent darhol bloklanadi. Biz bunday axloqsizlikka javobgar emasmiz.</p>
<p>5. Telegram kanaldan 15 kun ichida chiqib ketsangiz, olgan mukofotingizning 2 baravari jarima yechiladi, balans minusga ketishi mumkin.</p>
<p>6. Botdan foydalanib o'z kanalingiz va ijtimoiy tarmog'ingizni yuritib daromad qilishingiz mumkin. Biz bundan xursandmiz.</p>
<button class=btn onclick="acceptTerms()">✅ Roziman, davom etish</button></div>`}
async function acceptTerms(){if(await api('/accept_terms',{method:'POST'}))load()}
async function render(){
 const A=$('#app'),N=$('#nav');
 if(!ME){A.innerHTML='<div class=card><p>Yuklanmoqda...</p></div>';return}
 if(!ME.terms){N.innerHTML='';A.innerHTML=termsHTML();return}
 if(ME.need_sub.length){N.innerHTML='';A.innerHTML=`<div class=card><h2>🔒 Majburiy obuna</h2><p>Davom etish uchun kanallarga obuna bo'ling:</p>${ME.need_sub.map(c=>`<button class="btn g" data-u="https://t.me/${esc(c.slice(1))}" onclick="go(this.dataset.u)">${esc(c)}</button>`).join('')}<button class=btn onclick="load()">✅ Tekshirish</button></div>`;return}
 const tabs=[['home','🏠 Asosiy'],['tasks','📋 Vazifalar'],['profile','👤 Profil']];if(ME.admin)tabs.push(['admin','⚙️ Admin']);
 N.innerHTML=tabs.map(t=>`<div class="${VIEW==t[0]?'on':''}" onclick="nav('${t[0]}')">${t[1]}</div>`).join('');
 const V={home,order,tasks,profile,deposit,ref,contest,admin}[VIEW]||home;
 A.innerHTML='<h1>🔥 Obunach1</h1>'+await V();cost()}
function home(){return `<div class=card><div class=row><div><div class=tag>Hamyon</div><div class=big>${ME.bal} ₽</div></div><button class="btn sm" onclick="nav('deposit')">+ Depozit</button></div></div>
<div class=g2><div class=tile onclick="daily()"><b>🎁</b>Kunlik bonus</div><div class=tile onclick="nav('ref')"><b>👥</b>Referal</div><div class=tile onclick="nav('deposit')"><b>👛</b>Hamyon</div><div class=tile onclick="nav('contest')"><b>🏆</b>Konkurs</div></div>
<button class=btn onclick="nav('order')">🛒 Buyurtma berish</button>`}
async function daily(){const r=await api('/daily',{method:'POST'});if(r){toast('🎁 Bonus qo\'shildi');load()}}
async function order(){const my=await api('/myorders')||[];
return `<div class=card><h2>🛒 Buyurtma</h2><label>Turi</label><select id=ot onchange=cost()>${Object.keys(ME.prices).map(k=>`<option value=${k}>${T[k][1]} ${T[k][0]} — ${ME.prices[k]} ₽</option>`).join('')}</select>
<label>Havola (kanal, post yoki video)</label><input id=ol placeholder="https://t.me/kanal">
<label>Soni</label><input id=oq type=number value=10 min=1 oninput=cost()>
<p id=oc style="margin-top:8px;color:var(--y)"></p>
<p>Telegram kanalga obuna uchun botni kanalga admin qiling: @${esc(ME.bot)}. Faqat ochiq kanallar. 18+ kontent taqiqlanadi.</p>
<button class=btn onclick=mkOrder()>Buyurtma berish</button></div>
<div class=card><h2>Buyurtmalarim</h2>${my.map(o=>`<div class=row style="margin-bottom:6px"><span class=tag>${T[o.type][1]} ${esc(o.title||o.link)} — ${o.qty-o.left}/${o.qty}</span><button class="btn g sm" onclick="cancelO(${o.id})">Bekor</button></div>`).join('')||'<p>Hali yo\'q</p>'}</div>`}
function cost(){const e=$('#oc');if(!e)return;e.textContent='Narxi: '+(ME.prices[$('#ot').value]*(+$('#oq').value||0)).toFixed(2)+' ₽'}
async function mkOrder(){const r=await api('/order',{json:{type:$('#ot').value,link:$('#ol').value,qty:+$('#oq').value}});if(r){toast('✅ Buyurtma joylandi');await load()}}
async function cancelO(id){if(await api('/order_cancel/'+id,{method:'POST'})){toast('Bekor qilindi, pul qaytdi');await load()}}
async function tasks(){const L=await api('/tasks')||[];
return L.map(o=>`<div class=card><div class=row><b>${T[o.type][1]} ${T[o.type][0]}</b><span style="color:var(--y);font-weight:700">+${o.reward} ₽</span></div><p>${esc(o.title||o.link)}</p><p class=tag>Qoldi: ${o.left}</p>
<button class="btn g" data-u="${esc(o.link)}" onclick="go(this.dataset.u)">🔗 Ochish</button>
${o.type=='tg_sub'?`<button class=btn onclick="claim(${o.id})">✅ Tekshirish</button>`:`<button class=btn onclick="pick(${o.id})">📸 Skrinshot yuborish</button>`}</div>`).join('')||'<div class=card><p>Hozircha vazifa yo\'q</p></div>'}
async function claim(id){const r=await api('/claim/'+id,{method:'POST'});if(r){toast('✅ +'+r.reward+' ₽');load()}}
function pick(id){const i=document.createElement('input');i.type='file';i.accept='image/*';
 i.onchange=async()=>{if(!i.files[0])return;toast('⏳ Tekshirilmoqda...');const f=new FormData();f.append('file',i.files[0]);
 const r=await api('/shot/'+id,{method:'POST',body:f});if(r){toast('✅ +'+r.reward+' ₽');load()}};i.click()}
function deposit(){return `<div class=card><h2>💳 Depozit</h2><p>Karta: <b>${esc(ME.card)}</b></p><p>Kurs: 100 000 so'm = ${ME.rate} ₽. Minimum: ${ME.min_dep} so'm.</p>
<label>Summa (so'm)</label><input id=ds type=number><label>To'lov cheki skrinshoti</label><input id=df type=file accept="image/*">
<button class=btn onclick=sendDep()>Yuborish</button></div>`}
async function sendDep(){const f=$('#df').files[0];if(!f||!$('#ds').value)return toast('Summa va chekni kiriting');
 const d=new FormData();d.append('som',$('#ds').value);d.append('file',f);
 if(await api('/deposit',{method:'POST',body:d})){toast('Admin tasdiqlashini kuting');nav('home')}}
function ref(){const l=`https://t.me/${ME.bot}?start=ref_${ME.id}`;
return `<div class=card><h2>👥 Referal</h2><p>Har bir do'stingiz uchun ${ME.ref_bonus} ₽.</p><input readonly value="${l}" onclick="this.select()">
<button class=btn data-u="https://t.me/share/url?url=${encodeURIComponent(l)}" onclick="go(this.dataset.u)">📤 Ulashish</button></div>
<div class=card><h2>Chaqirganlarim (${ME.refs.length})</h2>${ME.refs.map(r=>`<p>• ${esc(r.name)}</p>`).join('')||'<p>Hali yo\'q</p>'}</div>`}
function contest(){return `<div class=card><h2>🏆 Konkurs</h2><p>${esc(ME.contest)}</p></div><div class=card><h2>Reyting</h2>${ME.top.map((t,i)=>`<div class=row><p>${i+1}. ${esc(t.name)}</p><b style="color:var(--y)">${t.c}</b></div>`).join('')||'<p>Hali hech kim yo\'q</p>'}</div>`}
function profile(){return `<div class=card><h2>👤 Profil</h2><p>ID: <b>${ME.id}</b></p><p>Kirgan sana: <b>${new Date(ME.joined*1000).toLocaleDateString()}</b></p>
<p>Botga solingan: <b>${ME.dep} so'm</b></p><p>Bajarilgan vazifalar: <b>${ME.done}</b></p><p>Chaqirgan odamlar: <b>${ME.refs.length}</b></p></div>
<div class=card><h2>Chaqirganlarim</h2>${ME.refs.map(r=>`<p>• ${esc(r.name)}</p>`).join('')||'<p>Hali yo\'q</p>'}</div>`}
async function admin(){
 const [st,s,os]=await Promise.all([api('/admin/stats'),api('/admin/settings'),api('/admin/orders')]);if(!s)return '';ADM=s;
 const f=Object.entries(s).map(([k,v])=>typeof v=='object'?`<label>${LB[k]||k}</label><textarea data-k="${k}" data-j="1" rows=4>${esc(JSON.stringify(v))}</textarea>`:`<label>${LB[k]||k}</label><input data-k="${k}" value="${esc(v)}">`).join('');
 return `<div class=card><h2>📊 Statistika</h2><p>Foydalanuvchilar: ${st.users} | Depozit: ${st.dep} so'm</p><p>Faol buyurtmalar: ${st.orders} | Bajarilgan: ${st.dones}</p></div>
<div class=card><h2>⚙️ Sozlamalar</h2>${f}<button class=btn onclick=saveSet()>💾 Saqlash</button><button class="btn g" onclick=cReset()>🏆 Konkursni yangilash</button></div>
<div class=card><h2>👤 Foydalanuvchi</h2><label>ID</label><input id=ui type=number><label>Summa (₽)</label><input id=ua type=number step=any>
<button class=btn onclick="uact('give')">➕ Mablag' berish</button><button class="btn g" onclick="uact('zero')">0 qilish</button>
<div class=g2><button class="btn g" onclick="uact('ban')">Bloklash</button><button class="btn g" onclick="uact('unban')">Blokdan chiqarish</button></div></div>
<div class=card><h2>📢 Xabar yuborish</h2><textarea id=bt rows=3></textarea><button class=btn onclick=bcast()>Yuborish</button></div>
<div class=card><h2>🛒 Faol buyurtmalar</h2>${os.map(o=>`<div class=row style="margin-bottom:8px"><span class=tag>#${o.id} | ${o.uid} | ${T[o.type][1]} ${esc(o.title||o.link)} (${o.left}/${o.qty})</span><button class="btn g sm" onclick="delO(${o.id})">O'chirish</button></div>`).join('')||'<p>Yo\'q</p>'}</div>`}
async function saveSet(){const o={};
 for(const e of document.querySelectorAll('[data-k]')){const k=e.dataset.k;
  try{o[k]=e.dataset.j?JSON.parse(e.value):(typeof ADM[k]=='number'?Number(e.value):e.value)}catch(x){return toast('JSON xato: '+k)}}
 if(await api('/admin/settings',{json:o}))toast('✅ Saqlandi')}
async function cReset(){if(await api('/admin/contest_reset',{method:'POST'}))toast('Konkurs yangilandi')}
async function uact(a){const r=await api('/admin/user',{json:{id:+$('#ui').value,action:a,amount:+($('#ua').value||0)}});if(r)toast('OK. Balans: '+r.bal)}
async function bcast(){if(await api('/admin/broadcast',{json:{text:$('#bt').value}}))toast('Yuborilmoqda...')}
async function delO(id){if(await api('/admin/order_del',{json:{id}})){toast('O\'chirildi, pul qaytdi');render()}}
load();
</script></body></html>
